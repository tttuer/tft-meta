[project]
name = "tft-meta-advisor-backend"
version = "0.1.0"
description = "TFT Meta Advisor Backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.110.0",
    "uvicorn[standard]==0.29.0",
    "sqlalchemy==2.0.29",
    "asyncpg==0.29.0",
    "alembic==1.13.1",
    "pydantic==2.6.4",
    "pydantic-settings==2.2.1",
    "redis==5.0.3",
    "httpx==0.27.0",
    "python-dotenv==1.0.1",
    # openai 제거 — OpenRouter는 httpx로 직접 호출
]

[tool.uv]
dev-dependencies = [
    "pytest==8.1.1",
    "pytest-asyncio==0.23.6",
    "httpx==0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
