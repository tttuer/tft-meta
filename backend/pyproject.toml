[project]
name = "tft-meta-advisor-backend"
version = "0.1.0"
description = "TFT Meta Advisor Backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy[asyncio]==2.0.36",
    "greenlet==3.1.1",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "pydantic==2.10.6",
    "pydantic-settings==2.7.0",
    "redis==5.2.1",
    "httpx==0.28.1",
    "python-dotenv==1.0.1",
    # STEP 2: 컴프 클러스터링 (코사인 유사도)
    "numpy>=2.1.0,<3.0.0",
    # STEP 2: Airflow DB 연결용 (psycopg2 동기 드라이버, Airflow 내부 사용)
    "psycopg2-binary>=2.9.9,<3.0.0",
]

[tool.uv]
dev-dependencies = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "httpx==0.28.1",
]
